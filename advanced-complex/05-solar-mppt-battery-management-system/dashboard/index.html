<!DOCTYPE html>
<html>
<head>
<title>Solar MPPT Dashboard</title>
<meta charset="utf-8">
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 2rem auto; }
  .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #ddd; }
  canvas { border: 1px solid #ccc; margin-top: 1rem; width: 100%; height: 120px; }
</style>
</head>
<body>
<h1>Solar MPPT Status</h1>
<div id="readings"></div>
<h2>Panel Power History</h2>
<canvas id="chart" width="440" height="120"></canvas>

<script>
async function refresh() {
  const res = await fetch('/api/data');
  const d = await res.json();
  document.getElementById('readings').innerHTML = `
    <div class="row"><span>Panel</span><span>${d.panelV.toFixed(1)} V, ${d.panelI.toFixed(2)} A, ${d.panelW.toFixed(1)} W</span></div>
    <div class="row"><span>Battery</span><span>${d.battV.toFixed(1)} V, ${d.battI.toFixed(2)} A</span></div>
    <div class="row"><span>State of Charge</span><span>${d.soc.toFixed(0)} %</span></div>
    <div class="row"><span>MPPT Duty Cycle</span><span>${d.duty} / 255</span></div>
  `;

  const hist = await (await fetch('/api/history')).json();
  drawChart(hist.map(r => r.panelW));
}

function drawChart(values) {
  const c = document.getElementById('chart');
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  if (values.length < 2) return;
  const max = Math.max(...values, 1);
  ctx.beginPath();
  values.forEach((v, i) => {
    const x = (i / (values.length - 1)) * c.width;
    const y = c.height - (v / max) * c.height;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#0a6';
  ctx.lineWidth = 2;
  ctx.stroke();
}

refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
